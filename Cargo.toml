[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/core",
    "crates/local-agent",
    "crates/cloud",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
authors = ["Nexsteaduser <admin@nexsteaduser.com>"]

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["json", "macros", "ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.22.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
dashmap = "6.1.0"
dirs = "7.0.0"
dunce = "1.0.5"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.34"
globset = "0.4.20"
hex = "0.4.3"
ignore = "0.4.33"
jsonwebtoken = "9.3.1"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
rand = "0.9.5"
rcgen = "0.14"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "charset"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
similar = "3.2.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "chrono", "uuid", "migrate", "macros", "json"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "fs", "net", "signal", "sync", "time", "io-util", "io-std"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots", "url"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = { version = "0.5.3", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit", "request-id", "set-header", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt", "time"] }
url = "2.5.7"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
